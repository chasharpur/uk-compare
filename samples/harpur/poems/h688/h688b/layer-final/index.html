<h2 class="head">Rhymes,
Humourous Poems,
Epigrams &c.</h2>

<h1 class="title">Wisdom s Dwelling.</h1>

<p class="stanza"><span class="line">A mind that’s made turbid by Fortune, may be</span>
<span class="line">Full and swift, like a brook, but not deep, like the sea<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">And Wisdom loves peace, choosing only to dwell</span>
<span class="line">In a soul deep enough to be quiet as well.</span></p>
