
<span class="page">103</span>
<h3 class="parthead">XX.</h3>

<h1 class="title">WISDOM’S DWELLING.</h1>

<div class="stanza"><span class="line">A mind that’s made torpid by fortune may be</span>
<span class="line">Full and swift, like a brook, but not deep, like the
sea<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">And Wisdom loves peace, choosing only to dwell</span>
<span class="line">In a soul deep enough to be quiet as well.</span></div>
