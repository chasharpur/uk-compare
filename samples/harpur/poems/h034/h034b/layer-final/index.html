<h3 class="parthead">IV</h3>

<h3 class="title">Be patient with a Fool.</h3>

<p class="stanza"><span class="line">The wise man’s patience is a fool’s mere due,</span>
<span class="line">Because to chide the creature were to be,</span>
<span class="line">Like one who, passing a fair orchard through,</span>
<span class="line">Should cast a stone up at a fruitless tree<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">And one who such a <span class="unclear">silly</span> deed should do,</span>
<span class="line">Were for the time as great a fool as he!</span></p>
