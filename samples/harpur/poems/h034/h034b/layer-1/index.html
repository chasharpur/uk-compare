<h3 class="parthead">IV</h3>

<h1 class="title">Be patient with a Fool.</h1>

<div class="stanza"><span class="line">The wise man’s patience is a fool’s mere due,</span>
<span class="line">For the same reason that it vain would be,</span>
<span class="line">To look for color when no light shines through,</span>
<span class="line">Or beat the branch of a fruitless tree<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">And one that should <span class="unclear">look far</span>, this should do,</span>
<span class="line">Were haply a far greater fool than he!</span></div>
