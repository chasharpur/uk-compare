

<span class="page">534</span>
<p class="parthead">IV.</p>

<p class="stanza"><span class="line">The race of men is as the race of leaves<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">Some the winds shed upon the ground, while still</span>
<span class="line">The fructifying boughs put others forth,</span>
<span class="line">To flourish in their season. So of men</span>
<span class="line">The generations die and are renewed.</span></p>
