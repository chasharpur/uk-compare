<p class="title">[AUSTRALIA’S FIRST GREAT POET]</p>

<p class="stanza"><span class="line">[...] Thence future Patriots too, the brave and wise,</span>
<span class="line-indent1">Should catch or stimulate their righteous rage:</span>
