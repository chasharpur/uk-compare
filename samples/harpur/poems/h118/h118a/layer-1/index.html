<p class="title">Epitaph.</p>

<p class="stanza"><span class="line">He who once was Thomas Cullen</span>
<span class="line-indent1">Lies here at length without gold</span>
<span class="line-indent1">He <span class="unclear">farmed</span> so gripingly of old!</span>
<span class="line">But with ten worms per cent his skull in</span>
<span class="line-indent1">(Or more, perchance, if all were told)</span>
<span class="line-indent3">Instead<span class="soft-hyphen">:</span></span><span class="soft-hyphen">
</span><span class="line">And this is all that can be said</span>
<span class="line-indent2">In Tom’s behalf</span>
<span class="line">Even in the way of Epitaph.</span></p>
