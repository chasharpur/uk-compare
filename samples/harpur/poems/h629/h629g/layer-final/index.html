

<span class="page">762</span>

<p class="title">[TO THE LYRE OF AUSTRALIA]</p>

<p class="stanza"><span class="line-indent1"> ——as music assuages</span><span class="hard-hyphen">
</span><span class="line-indent1">——the gale sweeping o’er,</span>
<span class="line">My country should heed in the rush of her ages</span>
<span class="line">The charm of thy wild voice, I’d covet no more</span></p>

<p class="trailer"><span class="date">1837</span></p>
